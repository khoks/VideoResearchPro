# Continuous integration (T-8.8.4.3). Every pull request and every push to
# master runs the suites below; docs/testing.md section 5.4 describes them.
#
# No job needs a secret: the backend suite stubs every LLM, Celery, Redis and
# the startup probes (backend/tests/conftest.py), the device tests answer every
# /api/v1 call from frontend/tests/fixtures/api, and the only downloads are
# public packages, the public embedding model and Playwright's browsers.
#
# Requiring these checks before a merge is a branch-protection setting on
# GitHub, which the repository owner turns on; this file does not change it.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # sentence-transformers pulls in PyTorch, and the default Linux wheel
      # brings several GB of CUDA libraries the suite never uses. The CPU
      # wheel satisfies the same requirement.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The multilingual embedder (EMBEDDING_MODEL_NAME) is about 470 MB from
      # the Hugging Face hub; Chroma keeps its own default ONNX model beside
      # it. Restored before the tests and saved even when they fail, so a red
      # run does not download them again.
      - name: Restore model caches
        id: models
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/chroma
          key: models-paraphrase-multilingual-MiniLM-L12-v2-v1

      - name: Download the embedding model
        if: steps.models.outputs.cache-hit != 'true'
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('paraphrase-multilingual-MiniLM-L12-v2')"

      # -rs prints each skipped test's reason, so a reviewer can see what the
      # runner did not exercise (ffmpeg, an FTS5 trigram SQLite, a PDF engine).
      - name: Run pytest
        run: python -m pytest tests/ -q -rs

      - name: Save model caches
        if: always() && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/chroma
          key: models-paraphrase-multilingual-MiniLM-L12-v2-v1

  lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The ruff version pinned in requirements-dev.txt, without the rest of
      # the backend's dependencies.
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' backend/requirements-dev.txt)"

      # A minimal ruleset the codebase passes today: syntax errors, undefined
      # names and invalid comparisons or statements (the checks that find bugs,
      # not style). Ruff's default set reports 57 existing findings (unused
      # imports, one-line statements); widening the rules means fixing those
      # first, in its own change.
      - name: Run ruff
        run: ruff check backend --select E9,F63,F7,F82 --output-format=github

  frontend:
    name: Frontend build and unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Run vitest
        run: npx vitest run

  extension:
    name: Browser extension tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm test

  device:
    name: Device tests (Playwright)
    # The screenshot baselines in frontend/tests/__screenshots__ are Windows
    # renders with no OS suffix: the pages set Georgia and Segoe UI, which a
    # Linux runner does not have, so an ubuntu run differs on every page.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Run the device tests
        run: npm run test:mobile

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
