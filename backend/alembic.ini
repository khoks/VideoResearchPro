[alembic]
script_location = alembic
# `env.py` imports `app`, and the `alembic` console script does not put the
# working directory on sys.path. Run it from backend/.
prepend_sys_path = .
path_separator = os
# No sqlalchemy.url: env.py uses the app's DATABASE_URL. A line here would win
# over it, and a second copy of that value is what T-2.6.7 removed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
