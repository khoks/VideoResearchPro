<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) pad the docked bars on notched phones. Never add maximum-scale / user-scalable=no (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pratidhvani — Your sources, echoed back.</title>
    <meta name="description" content="A personal research library: ingest sources once, read citation-backed reports, ask questions across everything you have gathered." />
    <!-- S-8.12.2: installable as a web app. No service worker on purpose (see docs/plans/m12-mobile-reading.md). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7a2c1a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pratidhvani" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
